<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA - Simulador Climático Global</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #start-screen {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.9);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 2s ease;
            pointer-events: auto;
        }

        #start-btn {
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #00e5ff;
            background: transparent;
            border: 2px solid #00e5ff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #start-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.8);
        }

        #hologram-panel {
            background: rgba(0, 20, 40, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1), inset 0 0 20px rgba(0, 229, 255, 0.05);
            width: 70%;
            max-width: 800px;
            padding: 40px;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1.5s ease, transform 1.5s ease, border-color 0.5s;
            pointer-events: auto;
            position: relative;
        }

        #hologram-panel.active { opacity: 1; transform: scale(1); }
        #hologram-panel.alert-mode {
            border-color: rgba(255, 50, 50, 0.6);
            box-shadow: 0 0 30px rgba(255, 50, 50, 0.2), inset 0 0 20px rgba(255, 50, 50, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 229, 255, 0.5);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #00e5ff;
            letter-spacing: 3px;
        }

        .alert-mode .title { color: #ff3333; border-color: #ff3333; }
        .alert-mode .header { border-bottom-color: rgba(255, 50, 50, 0.5); }

        .audio-waves { display: flex; align-items: center; gap: 4px; height: 30px; }
        .bar {
            width: 4px; height: 5px; background-color: #00e5ff; border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }
        .alert-mode .bar { background-color: #ff3333; }
        .bar:nth-child(1) { animation-delay: 0.0s; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave { 0%, 100% { height: 5px; } 50% { height: 25px; } }

        #dialogue-text { font-size: 1.3rem; line-height: 1.6; min-height: 120px; text-shadow: 0 0 5px rgba(255, 255, 255, 0.3); }

        #next-btn {
            margin-top: 20px; padding: 10px 20px; background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff;
            color: #00e5ff; font-family: 'Orbitron', sans-serif; cursor: pointer; float: right; transition: 0.2s; display: none;
        }
        #next-btn:hover { background: #00e5ff; color: #000; }

        .alert-mode #next-btn { border-color: #ff3333; color: #ff3333; background: rgba(255, 50, 50, 0.1); }
        .alert-mode #next-btn:hover { background: #ff3333; color: #000; }

        #hud-title {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-family: 'Orbitron', sans-serif;
            font-size: 2rem; color: #00e5ff; letter-spacing: 5px; opacity: 0; transition: opacity 2s; text-shadow: 0 0 10px #00e5ff;white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">Restaurar Link Neural</button>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="hud-title">SIMULADOR CLIMÁTICO GLOBAL</div>
        <div id="hologram-panel">
            <div class="header">
                <div class="title" id="panel-title">SISTEMA GAIA</div>
                <div class="audio-waves" id="waves" style="display: none;">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
            <div id="dialogue-text"></div>
            <button id="next-btn">Avançar >></button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO DA CENA 3D (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.001);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);

        // Carregador de Texturas para a Terra Realista
        const textureLoader = new THREE.TextureLoader();
        // Textura base de alta resolução do Three.js
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');

        const earthGeometry = new THREE.SphereGeometry(3, 64, 64);
        const earthMaterial = new THREE.MeshPhongMaterial({ 
            map: earthTexture,
            color: 0xaaaaaa, // Ajuste para não ficar tão escuro
            emissive: 0x011125,
            shininess: 10 
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        
        // Atmosfera externa brilhante
        const atmosGeometry = new THREE.SphereGeometry(3.1, 64, 64);
        const atmosMaterial = new THREE.MeshPhongMaterial({
            color: 0x00e5ff, transparent: true, opacity: 0.15, side: THREE.BackSide, blending: THREE.AdditiveBlending
        });
        const atmosphere = new THREE.Mesh(atmosGeometry, atmosMaterial);
        scene.add(atmosphere);
        scene.add(earth);

        const carbonGeometry = new THREE.BufferGeometry();
        const carbonCount = 2000;
        const posArray = new Float32Array(carbonCount * 3);
        
        for(let i = 0; i < carbonCount * 3; i+=3) {
            const r = 3.2 + Math.random() * 1.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);
        }
        carbonGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const carbonMaterial = new THREE.PointsMaterial({ size: 0.02, color: 0x888888, transparent: true, opacity: 0.0 });
        const carbonParticles = new THREE.Points(carbonGeometry, carbonMaterial);
        scene.add(carbonParticles);

        const starsGeometry = new THREE.BufferGeometry();
        const starsArray = new Float32Array(3000);
        for(let i=0; i<3000; i++) { starsArray[i] = (Math.random() - 0.5) * 100; }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        const alertsGroup = new THREE.Group();
        earth.add(alertsGroup);

        function createAlertMarker(lat, lon) {
            const markerGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0 });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            marker.position.set(-(3 * Math.sin(phi) * Math.cos(theta)), 3 * Math.cos(phi), 3 * Math.sin(phi) * Math.sin(theta));
            
            const ringGeo = new THREE.RingGeometry(0.15, 0.25, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide, transparent: true, opacity: 0 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(marker.position);
            ring.lookAt(new THREE.Vector3(0,0,0));
            
            alertsGroup.add(marker);
            alertsGroup.add(ring);
            return { marker, ring };
        }

        const alertAmazonia = createAlertMarker(-3.4, -62.2);
        const alertAtlantico = createAlertMarker(0, -30);
        let showAlerts = false;
        let targetCameraZ = 15;

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001; // Rotação da Terra com os continentes
            carbonParticles.rotation.y -= 0.0005;
            carbonParticles.rotation.x += 0.0002;
            camera.position.z += (targetCameraZ - camera.position.z) * 0.02;

            if(showAlerts) {
                const pulse = (Math.sin(Date.now() * 0.005) + 1) / 2;
                [alertAmazonia, alertAtlantico].forEach(a => {
                    a.marker.material.opacity = 0.8;
                    a.ring.scale.set(1 + pulse, 1 + pulse, 1);
                    a.ring.material.opacity = 1 - pulse;
                });
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 2. ÁUDIO AMBIENTE E EFEITOS (Web Audio API) ---
        let audioCtx;
        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSpaceWind() {
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 400;

            const gain = audioCtx.createGain();
            gain.gain.value = 0.2; // AUMENTADO: de 0.05 para 0.2

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function playBeep() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // NOVO: Bipes rápidos de telemetria enquanto o texto é digitado
        function playTypingBeep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            // Frequência aleatória para simular sons de terminal de dados
            osc.frequency.setValueAtTime(1200 + Math.random() * 800, audioCtx.currentTime);
            
            // Volume bem baixinho para não atrapalhar a voz
            gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }


        // --- 3. SÍNTESE DE VOZ DA GAIA (SpeechSynthesis API) ---
        let gaiaVoice = null;

        // GAIA fala com voz feminina. A API de síntese de fala não informa o
        // gênero das vozes instaladas, então filtramos pelos nomes delas.
        const VOZES_GAIA_FEMININAS = ['maria', 'luciana', 'francisca', 'helena', 'fernanda',
            'juliana', 'camila', 'amanda', 'alice', 'beatriz', 'larissa', 'yara',
            'lucia', 'vitória', 'vitoria', 'ines', 'female', 'feminin', 'feminina'];
        const VOZES_GAIA_MASCULINAS = ['daniel', 'antonio', 'antônio', 'ricardo', 'felipe',
            'joao', 'joão', 'jorge', 'diego', 'marcos', 'male', 'masculin', 'masculina'];

        function escolherVozGaia() {
            const vozes = window.speechSynthesis.getVoices();
            if (!vozes.length) return null;
            const nome = v => (v.name || '').toLowerCase();
            const ptBR = vozes.filter(v => /^pt[-_]BR/i.test(v.lang));
            const lista = ptBR.length ? ptBR : vozes;
            const semMasculinas = lista.filter(
                v => !VOZES_GAIA_MASCULINAS.some(n => nome(v).includes(n))
            );
            const femininas = semMasculinas.filter(
                v => VOZES_GAIA_FEMININAS.some(n => nome(v).includes(n))
            );
            return femininas[0] || semMasculinas[0] || lista[0] || null;
        }

        function carregarVozes() {
            gaiaVoice = escolherVozGaia();
        }
        
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = carregarVozes;
        }

        function playGaiaVoice(text) {
            window.speechSynthesis.cancel(); 

            // Ajusta a pronúncia de expressões específicas
            let spokenText = text.replace(
                /Amazon Tipping Point/g,
                "amazon taipinn pointi"
            );

            const utterance = new SpeechSynthesisUtterance(spokenText);
            if (gaiaVoice) utterance.voice = gaiaVoice;
            utterance.lang = 'pt-BR';
            utterance.pitch = 0.9; 
            utterance.rate = 1.0;  
            
            utterance.onend = () => {
                document.getElementById('waves').style.display = 'none';
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- 4. LÓGICA DE SEQUÊNCIA E DIÁLOGO ---
        const dialogues = [
            "Conexão neural estabelecida. Iniciando protocolo de emergência climática... Cientista, se você consegue me ouvir, significa que fomos bem-sucedidos em restaurar o link de comunicação.",
            "Estamos em 2030. O aquecimento global está levando o Sistema Terra a um ponto crítico. Atmosfera, Oceano e, principalmente, a Floresta Amazônica estão sob crescente pressão. Nossos sensores indicam que a Amazônia se aproxima perigosamente de seu ponto de não retorno — o Amazon Tipping Point. Se esse limite for ultrapassado, mudanças irreversíveis poderão comprometer o equilíbrio climático do planeta.",
            "Eu sou GAIA. Fui criada para monitorar o clima do planeta, mas não posso tomar decisões políticas ou ecológicas. Para evitar a catástrofe, eu preciso da sua mente analítica. Tentei alertar autoridades, mas meus apelos foram ignorados. Posso entregar a você o acesso total ao Simulador Climático Global e cada decisão sua mudará o destino de bilhões. Sua primeira missão começa agora!"
        ];

        let currentStep = 0;
        const textElement = document.getElementById('dialogue-text');
        const nextBtn = document.getElementById('next-btn');
        const panel = document.getElementById('hologram-panel');
        const waves = document.getElementById('waves');

        function typeWriter(text, i, cb) {
            if (i === 0) {
                textElement.innerHTML = "";
                waves.style.display = 'flex'; 
                playGaiaVoice(text); 
            }
            
            if (i < text.length) {
                textElement.innerHTML += text.charAt(i);
                
                // Dispara o bipe de digitação a cada 3 letras para não sobrecarregar o áudio
                if (i % 3 === 0) playTypingBeep();

                setTimeout(() => typeWriter(text, i + 1, cb), 45); 
            } else {
                if(cb) cb();
            }
        }

        function runSequence() {
            nextBtn.style.display = 'none';
            
            if(currentStep === 0) {
                panel.classList.add('active');
            } 
            else if (currentStep === 1) {
                targetCameraZ = 8;
                showAlerts = true;
                panel.classList.add('alert-mode');
                document.getElementById('panel-title').innerText = "GAIA - ALERTA CRÍTICO";
                
                let cTimer = 0;
                const cInt = setInterval(() => {
                    cTimer += 0.05;
                    carbonParticles.material.opacity = Math.min(0.6, cTimer);
                    if(cTimer >= 0.6) clearInterval(cInt);
                }, 100);
            }
            else if (currentStep === 2) {
                panel.classList.remove('alert-mode');
                document.getElementById('panel-title').innerText = "SISTEMA GAIA";
                document.getElementById('hud-title').style.opacity = 1;
                targetCameraZ = 12;
            }

            typeWriter(dialogues[currentStep], 0, () => {
                if (currentStep < dialogues.length - 1) {
                    nextBtn.innerHTML = "Avançar >>";
                    nextBtn.style.display = 'block';
                } else {
                    nextBtn.innerHTML = "Iniciar Missão: Atmosfera";
                    nextBtn.style.display = 'block';
                    nextBtn.onclick = () => {
                        window.speechSynthesis.cancel();
                        playBeep();
                        // Redireciona mantendo o contexto de interação para os sons
                        setTimeout(() => {
                            window.location.href = 'missao_atmosfera.html';
                        }, 200);
                    }
                }
            });
        }

        // --- 5. INÍCIO AUTOMÁTICO ---
        // Não há botão de abertura: a etapa começa sozinha, para que a
        // passagem de main.html para cá não apareça como uma quebra.
        (function iniciarEtapa() {
            const startScreen = document.getElementById('start-screen');
            if (startScreen) startScreen.style.display = 'none';

            initAudio();
            playSpaceWind();
            playBeep();

            const unlockVoice = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(unlockVoice);

            // O navegador só libera o áudio depois de uma interação do
            // usuário, e a troca de arquivo é automática. Se o contexto
            // ficar suspenso, ele é retomado no primeiro clique ou tecla,
            // sem exibir aviso algum.
            const liberarAudio = () => {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                window.removeEventListener('pointerdown', liberarAudio);
                window.removeEventListener('keydown', liberarAudio);
            };
            window.addEventListener('pointerdown', liberarAudio);
            window.addEventListener('keydown', liberarAudio);

            // O painel holográfico entra com fade de 1,5 s, então uma pausa
            // curta já basta. Havia aqui um atraso total de 4 s: o primeiro
            // segundo e meio era para o fade-out da tela de abertura, que
            // não existe mais desde o início automático.
            setTimeout(runSequence, 600);
        })();

        nextBtn.addEventListener('click', () => {
            playBeep();
            window.speechSynthesis.cancel(); 
            currentStep++;
            runSequence();
        });

    </script>
</body>
</html>
